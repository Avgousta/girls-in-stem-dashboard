name: Daily Database Backup

on:
  schedule:
    - cron: '0 2 * * *'   # 2am UTC daily (4am South Africa time)
  workflow_dispatch:        # allow manual trigger from GitHub Actions UI

jobs:
  backup:
    name: pg_dump → artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Dump database
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          FILENAME="girls-stem-backup-${TIMESTAMP}.sql.gz"
          pg_dump \
            --host=db.oozpukejqxqqgjklccjk.supabase.co \
            --port=5432 \
            --username=postgres \
            --dbname=postgres \
            --no-password \
            --format=plain \
            --schema=public \
            | gzip > "${FILENAME}"
          echo "BACKUP_FILE=${FILENAME}" >> $GITHUB_ENV
          echo "Backup complete: ${FILENAME} ($(du -sh ${FILENAME} | cut -f1))"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Database backup failed — check the logs and verify SUPABASE_DB_PASSWORD is set correctly"
